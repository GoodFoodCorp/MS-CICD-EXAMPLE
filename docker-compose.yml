services:
  auth-service:
    build: .
    container_name: auth-service
    ports:
      - "8081:8081"
    env_file:
      - .env
    depends_on:
      auth-db:
        condition: service_healthy
    networks:
      - microservices-net

  auth-db:
    image: postgres:17-alpine
    container_name: auth-postgres
    env_file:
      - .env
    volumes:
      - auth_data:/var/lib/postgresql/data
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  microservices-net:
    external: true

volumes:
  auth_data:
