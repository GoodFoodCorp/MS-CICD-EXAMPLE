services:
  auth-service:
    build: .
    container_name: auth-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    env_file:
      - .env
    environment:
      FRANCHISE_SERVICE_URL: http://franchise-service:8089
    depends_on:
      auth-db:
        condition: service_healthy
    networks:
      - microservices-net

  auth-db:
    image: postgres:17-alpine
    container_name: auth-postgres
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - auth_data:/var/lib/postgresql/data
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: auth-adminer
    restart: unless-stopped
    ports:
      - "8090:8080" # 8082 is taken by order-service
    environment:
      ADMINER_DEFAULT_SERVER: auth-db
    depends_on:
      auth-db:
        condition: service_healthy
    networks:
      - microservices-net

networks:
  microservices-net:
    external: true

volumes:
  auth_data:
