name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: write
  security-events: write
  packages: write

env:
  GO_VERSION: "1.24.13"
  DOCKER_REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/auth-service

jobs:
  # ═══════════════════════════════════════════════════════════
  # Job 1: Build et Tests
  # ═══════════════════════════════════════════════════════════
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Nécessaire pour le versioning

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify dependencies
        run: |
          go mod verify
          go mod download

      - name: Build
        run: |
          go build -v -o auth-service ./cmd/main.go
          echo "✅ Build réussi"

      - name: Run Tests
        run: |
          go test ./... -v -coverprofile=coverage.out -covermode=count
          go tool cover -func=coverage.out

      - name: Upload coverage to artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.out
            coverage.html

  # ═══════════════════════════════════════════════════════════
  # Job 2: Security Scanning
  # ═══════════════════════════════════════════════════════════
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Run gosec Security Scanner
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -no-fail -fmt=sarif -out=gosec-results.sarif ./... || true

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: gosec-results.sarif
          category: gosec

  # ═══════════════════════════════════════════════════════════
  # Job 3: Versioning & Tagging
  # ═══════════════════════════════════════════════════════════
  versioning:
    name: Version & Tag
    runs-on: ubuntu-latest
    needs: [build-and-test, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    outputs:
      version: ${{ steps.semver.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get next version
        id: semver
        run: |
          # Récupérer le dernier tag
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Dernier tag: $LATEST_TAG"

          # Extraire le numéro de version
          VERSION=${LATEST_TAG#v}
          IFS='.' read -r -a VERSION_PARTS <<< "$VERSION"

          MAJOR="${VERSION_PARTS[0]:-0}"
          MINOR="${VERSION_PARTS[1]:-0}"
          PATCH="${VERSION_PARTS[2]:-0}"

          # Incrémenter la version patch
          PATCH=$((PATCH + 1))
          NEW_VERSION="v${MAJOR}.${MINOR}.${PATCH}"

          # Si commit contient [major] ou [minor], incrémenter en conséquence
          COMMIT_MSG=$(git log -1 --pretty=%B)
          if [[ $COMMIT_MSG == *"[major]"* ]]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
            NEW_VERSION="v${MAJOR}.${MINOR}.${PATCH}"
          elif [[ $COMMIT_MSG == *"[minor]"* ]]; then
            MINOR=$((MINOR + 1))
            PATCH=0
            NEW_VERSION="v${MAJOR}.${MINOR}.${PATCH}"
          fi

          echo "Nouvelle version: $NEW_VERSION"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Create and push tag
        run: |
          VERSION="${{ steps.semver.outputs.version }}"
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.semver.outputs.version }}
          name: Release ${{ steps.semver.outputs.version }}
          body: |
            ## Changes in this Release
            - Auto-generated release for version ${{ steps.semver.outputs.version }}

            ## Docker Image
            ```
            docker pull ${{ env.IMAGE_NAME }}:${{ steps.semver.outputs.version }}
            ```
          draft: false
          prerelease: false

  # ═══════════════════════════════════════════════════════════
  # Job 4: Build & Push Docker Image
  # ═══════════════════════════════════════════════════════════
  docker:
    name: Build & Push Docker
    runs-on: ubuntu-latest
    needs: versioning
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.versioning.outputs.version }}
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max

  # ═══════════════════════════════════════════════════════════
  # Job 5: Terraform Infrastructure
  # ═══════════════════════════════════════════════════════════
  terraform:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: [versioning, docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    outputs:
      k3s_ip: ${{ steps.tf-output.outputs.k3s_ip }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Terraform Plan
        working-directory: ./terraform
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: ./terraform
        run: terraform apply -auto-approve tfplan

      - name: Get Terraform Outputs
        id: tf-output
        working-directory: ./terraform
        run: |
          echo "k3s_ip=$(terraform output -raw k3s_public_ip)" >> $GITHUB_OUTPUT

          # Sauvegarder la clé SSH privée pour le job deploy
          terraform output -raw ssh_private_key > ../ssh_key.pem
          chmod 600 ../ssh_key.pem

      - name: Upload SSH Key as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ssh-key
          path: ssh_key.pem
          retention-days: 1

      - name: Wait for K3s to be ready
        run: |
          echo "⏳ Attente que K3s soit prêt (30s)..."
          sleep 30

  # ═══════════════════════════════════════════════════════════
  # Job 6: Deploy to Kubernetes
  # ═══════════════════════════════════════════════════════════
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: [versioning, docker, terraform]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download SSH Key
        uses: actions/download-artifact@v4
        with:
          name: ssh-key

      - name: Setup SSH & Get Kubeconfig
        run: |
          # Installer kubectl
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

          # Configurer SSH
          mkdir -p ~/.ssh
          mv ssh_key.pem ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ needs.terraform.outputs.k3s_ip }} >> ~/.ssh/known_hosts

          # Télécharger le kubeconfig
          scp -i ~/.ssh/id_rsa ec2-user@${{ needs.terraform.outputs.k3s_ip }}:/home/ec2-user/.kube/config kubeconfig.yaml

          # Remplacer localhost par l'IP publique
          sed -i "s/127.0.0.1/${{ needs.terraform.outputs.k3s_ip }}/g" kubeconfig.yaml

          export KUBECONFIG=$(pwd)/kubeconfig.yaml
          echo "KUBECONFIG=$(pwd)/kubeconfig.yaml" >> $GITHUB_ENV

          # Tester la connexion
          kubectl cluster-info
          kubectl get nodes

      - name: Deploy to Kubernetes
        run: |
          # Créer le namespace si nécessaire
          kubectl create namespace auth-service --dry-run=client -o yaml | kubectl apply -f -

          # Appliquer les manifests Kubernetes
          kubectl apply -f k8s/ -n auth-service

          # Mettre à jour l'image avec la nouvelle version
          kubectl set image deployment/auth-service \
            auth-service=${{ env.IMAGE_NAME }}:${{ needs.versioning.outputs.version }} \
            -n auth-service

          # Attendre le rollout
          kubectl rollout status deployment/auth-service -n auth-service --timeout=5m

          echo "✅ Déploiement réussi!"

      - name: Send notification
        if: always()
        run: |
          STATUS="${{ job.status }}"
          VERSION="${{ needs.versioning.outputs.version }}"

          # Envoyer une notification webhook
          curl -X POST "${{ secrets.WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"service\": \"auth-service\",
              \"version\": \"$VERSION\",
              \"status\": \"$STATUS\",
              \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",
              \"commit\": \"${{ github.sha }}\",
              \"author\": \"${{ github.actor }}\"
            }" || echo "⚠️ Notification webhook failed (non-blocking)"

      - name: Deployment summary
        run: |
          echo "## 🚀 Déploiement réussi!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ needs.versioning.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: ${{ env.IMAGE_NAME }}:${{ needs.versioning.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Auteur**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
