name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: "Action à exécuter"
        required: true
        type: choice
        options:
          - deploy
          - destroy
        default: deploy

permissions:
  contents: write
  security-events: write
  packages: write

env:
  GO_VERSION: "1.26.1"
  DOCKER_REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/auth-service

jobs:
  # ---------------------------------------------------------
  # Job 1: Build et Tests
  # ---------------------------------------------------------
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Nécessaire pour le versioning

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify dependencies
        run: |
          go mod verify
          go mod download

      - name: Build
        run: |
          go build -v -o auth-service ./cmd/main.go
          echo "Build successful"

      - name: Run Tests
        run: |
          go test ./... -v -coverprofile=coverage.out -covermode=count
          go tool cover -func=coverage.out

      - name: Upload coverage to artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.out
            coverage.html

  # ---------------------------------------------------------
  # Job 2: Security Scanning
  # ---------------------------------------------------------
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Run gosec Security Scanner
        continue-on-error: true
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -no-fail -fmt=sarif -out=gosec-results.sarif ./... || true

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: gosec-results.sarif
          category: gosec

  # ---------------------------------------------------------
  # Job 3: Versioning & Tagging
  # ---------------------------------------------------------
  versioning:
    name: Version & Tag
    runs-on: ubuntu-latest
    needs: [build-and-test, security]
    if: |
      (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'deploy')
    permissions:
      contents: write
    outputs:
      version: ${{ steps.semver.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get next version
        id: semver
        run: |
          # Récupérer le dernier tag
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Dernier tag: $LATEST_TAG"

          # Extraire le numéro de version
          VERSION=${LATEST_TAG#v}
          IFS='.' read -r -a VERSION_PARTS <<< "$VERSION"

          MAJOR="${VERSION_PARTS[0]:-0}"
          MINOR="${VERSION_PARTS[1]:-0}"
          PATCH="${VERSION_PARTS[2]:-0}"

          # Incrémenter la version patch
          PATCH=$((PATCH + 1))
          NEW_VERSION="v${MAJOR}.${MINOR}.${PATCH}"

          # Si commit contient [major] ou [minor], incrémenter en conséquence
          COMMIT_MSG=$(git log -1 --pretty=%B)
          if [[ $COMMIT_MSG == *"[major]"* ]]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
            NEW_VERSION="v${MAJOR}.${MINOR}.${PATCH}"
          elif [[ $COMMIT_MSG == *"[minor]"* ]]; then
            MINOR=$((MINOR + 1))
            PATCH=0
            NEW_VERSION="v${MAJOR}.${MINOR}.${PATCH}"
          fi

          echo "Nouvelle version: $NEW_VERSION"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Create and push tag
        run: |
          VERSION="${{ steps.semver.outputs.version }}"
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.semver.outputs.version }}
          name: Release ${{ steps.semver.outputs.version }}
          body: |
            ## Changes in this Release
            - Auto-generated release for version ${{ steps.semver.outputs.version }}

            ## Docker Image
            ```
            docker pull ${{ env.IMAGE_NAME }}:${{ steps.semver.outputs.version }}
            ```
          draft: false
          prerelease: false

  # ---------------------------------------------------------
  # Job 4: Build & Push Docker Image
  # ---------------------------------------------------------
  docker:
    name: Build & Push Docker
    runs-on: ubuntu-latest
    needs: versioning
    if: |
      (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'deploy')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract version without v prefix
        id: version
        run: |
          VERSION="${{ needs.versioning.outputs.version }}"
          # Retirer le 'v' au début si présent
          VERSION_NO_V="${VERSION#v}"
          echo "version_no_v=${VERSION_NO_V}" >> $GITHUB_OUTPUT
          echo "Version Docker: ${VERSION_NO_V}"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version_no_v }}
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          build-args: |
            BUILD_DATE=${{ github.run_id }}
            VERSION=${{ steps.version.outputs.version_no_v }}
          no-cache: true

  # ---------------------------------------------------------
  # Job 5: Terraform Infrastructure (Intelligent)
  # ---------------------------------------------------------
  terraform:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: [versioning, docker]
    if: |
      (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'deploy')
    outputs:
      k3s_ip: ${{ steps.deploy.outputs.K3S_IP }}
      terraform_changes: ${{ steps.deploy.outputs.TERRAFORM_CHANGES }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0
          terraform_wrapper: false

      - name: Pre-deployment Cleanup
        working-directory: ./terraform
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          chmod +x pre-deploy-cleanup.sh
          ./pre-deploy-cleanup.sh || echo "[WARNING] Cleanup failed, continuing anyway..."

      - name: Smart Terraform Deployment
        id: deploy
        working-directory: ./terraform
        env:
          TF_VAR_docker_username: ${{ secrets.DOCKER_USERNAME }}
          TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          chmod +x ci-deploy.sh
          ./ci-deploy.sh

      - name: Get K3s IP (fallback)
        id: get-ip
        if: steps.deploy.outputs.K3S_IP == ''
        working-directory: ./terraform
        run: |
          # Si le script n'a pas trouvé l'IP, chercher dans l'état
          if terraform output k3s_public_ip &>/dev/null; then
            K3S_IP=$(terraform output -raw k3s_public_ip)
            echo "K3S_IP=${K3S_IP}" >> $GITHUB_OUTPUT
            echo "[OK] K3s IP retrieved: ${K3S_IP}"
          else
            echo "[ERROR] Unable to retrieve K3s IP"
            exit 1
          fi

      - name: Prepare SSH Key
        run: |
          cd terraform
          if [ -f ../ssh_key.pem ]; then
            echo "[OK] SSH key already prepared"
          else
            terraform output -raw ssh_private_key > ../ssh_key.pem
            chmod 600 ../ssh_key.pem
            echo "[OK] SSH key extracted from state"
          fi

      - name: Upload SSH Key as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ssh-key
          path: ssh_key.pem
          retention-days: 1

      - name: Wait for K3s to be ready
        if: steps.deploy.outputs.TERRAFORM_CHANGES == 'true'
        run: |
          echo "[INFO] Infrastructure modified - Waiting for K3s to be ready (90s)..."
          sleep 90

      - name: Summary
        run: |
          echo "## Terraform Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.deploy.outputs.TERRAFORM_CHANGES }}" = "true" ]; then
            echo "- Infrastructure updated" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Infrastructure already up to date - No changes" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**K3s IP:** ${{ steps.deploy.outputs.K3S_IP || steps.get-ip.outputs.K3S_IP }}" >> $GITHUB_STEP_SUMMARY

  # ---------------------------------------------------------
  # Job 6: Deploy to Kubernetes
  # ---------------------------------------------------------
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: [versioning, docker, terraform]
    if: |
      (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'deploy')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0
          terraform_wrapper: false

      - name: Download SSH Key
        uses: actions/download-artifact@v4
        with:
          name: ssh-key

      - name: Set K3s IP
        id: k3s-ip
        run: |
          # Récupérer l'IP depuis les outputs (avec fallback si besoin)
          K3S_IP="${{ needs.terraform.outputs.k3s_ip }}"
          echo "K3S_IP=${K3S_IP}" >> $GITHUB_OUTPUT
          echo "[INFO] Using K3s IP: ${K3S_IP}"

      - name: Setup SSH & Get Kubeconfig
        env:
          K3S_IP: ${{ steps.k3s-ip.outputs.K3S_IP }}
        run: |
          # Installer kubectl
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

          # Configurer SSH
          mkdir -p ~/.ssh
          mv ssh_key.pem ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${K3S_IP}" >> ~/.ssh/known_hosts

          # Attendre que le serveur soit accessible via SSH
          echo "[INFO] Checking SSH accessibility of ${K3S_IP}..."
          MAX_SSH_RETRIES=6
          SSH_RETRY=0
          while [ $SSH_RETRY -lt $MAX_SSH_RETRIES ]; do
            if ssh -i ~/.ssh/id_rsa -o ConnectTimeout=5 -o StrictHostKeyChecking=no ec2-user@${K3S_IP} "echo 'SSH OK'" &>/dev/null; then
              echo "[OK] SSH server accessible"
              break
            else
              SSH_RETRY=$((SSH_RETRY + 1))
              if [ $SSH_RETRY -lt $MAX_SSH_RETRIES ]; then
                echo "[WAIT] SSH not ready yet (attempt $SSH_RETRY/$MAX_SSH_RETRIES), waiting 5s..."
                sleep 5
              else
                echo "[ERROR] Unable to connect via SSH after $MAX_SSH_RETRIES attempts"
                exit 1
              fi
            fi
          done

          # Attendre que le script user-data.sh soit terminé (flag .k3s-ready)
          echo "[INFO] Waiting for initialization script to complete..."
          MAX_INIT_RETRIES=10
          INIT_RETRY=0
          while [ $INIT_RETRY -lt $MAX_INIT_RETRIES ]; do
            if ssh -i ~/.ssh/id_rsa -o ConnectTimeout=5 ec2-user@${K3S_IP} "test -f /home/ec2-user/.k3s-ready"; then
              echo "[OK] Initialization script completed"
              break
            else
              INIT_RETRY=$((INIT_RETRY + 1))
              if [ $INIT_RETRY -lt $MAX_INIT_RETRIES ]; then
                echo "[WAIT] Initialization in progress (attempt $INIT_RETRY/$MAX_INIT_RETRIES), waiting 10s..."
                sleep 10
              else
                echo "[ERROR] Timeout: initialization not completed after $MAX_INIT_RETRIES attempts"
                echo "[DEBUG] Checking initialization logs:"
                ssh -i ~/.ssh/id_rsa ec2-user@${K3S_IP} "sudo tail -50 /var/log/user-data.log" || true
                exit 1
              fi
            fi
          done

          # Télécharger le kubeconfig directement (pas besoin de vérifier l'existence d'abord)
          echo "[INFO] Downloading kubeconfig..."
          MAX_SCP_RETRIES=3
          SCP_RETRY=0
          while [ $SCP_RETRY -lt $MAX_SCP_RETRIES ]; do
            if scp -i ~/.ssh/id_rsa -o ConnectTimeout=10 ec2-user@${K3S_IP}:/home/ec2-user/.kube/config kubeconfig.yaml 2>/dev/null; then
              echo "[OK] Kubeconfig retrieved"
              break
            else
              SCP_RETRY=$((SCP_RETRY + 1))
              if [ $SCP_RETRY -lt $MAX_SCP_RETRIES ]; then
                echo "[WAIT] Kubeconfig not ready (attempt $SCP_RETRY/$MAX_SCP_RETRIES), waiting 5s..."
                sleep 5
              else
                echo "[ERROR] Unable to retrieve kubeconfig after $MAX_SCP_RETRIES attempts"
                echo "[DEBUG] K3s logs:"
                ssh -i ~/.ssh/id_rsa ec2-user@${K3S_IP} "sudo tail -30 /var/log/user-data.log" || true
                exit 1
              fi
            fi
          done

          # Remplacer localhost par l'IP publique
          sed -i "s/127.0.0.1/${K3S_IP}/g" kubeconfig.yaml

          export KUBECONFIG=$(pwd)/kubeconfig.yaml
          echo "KUBECONFIG=$(pwd)/kubeconfig.yaml" >> $GITHUB_ENV

          # Désactiver la vérification TLS (le certificat K3s est pour 127.0.0.1)
          kubectl config set-cluster default --insecure-skip-tls-verify=true

          # Tester la connexion avec retry
          echo "[INFO] Testing cluster connection..."
          MAX_KUBECTL_RETRIES=3
          KUBECTL_RETRY=0
          while [ $KUBECTL_RETRY -lt $MAX_KUBECTL_RETRIES ]; do
            if kubectl get nodes &>/dev/null; then
              echo "[OK] Cluster connection successful"
              kubectl cluster-info
              kubectl get nodes
              break
            else
              KUBECTL_RETRY=$((KUBECTL_RETRY + 1))
              if [ $KUBECTL_RETRY -lt $MAX_KUBECTL_RETRIES ]; then
                echo "[WAIT] Cluster not ready yet (attempt $KUBECTL_RETRY/$MAX_KUBECTL_RETRIES), waiting 5s..."
                sleep 5
              else
                echo "[ERROR] Unable to connect to cluster after $MAX_KUBECTL_RETRIES attempts"
                exit 1
              fi
            fi
          done

      - name: Verify Docker image exists
        run: |
          VERSION="${{ needs.versioning.outputs.version }}"
          # Retirer le 'v' au début si présent
          VERSION_NO_V="${VERSION#v}"
          IMAGE="${{ env.IMAGE_NAME }}:${VERSION_NO_V}"

          echo "[INFO] Checking image existence: ${IMAGE}..."

          # Attendre que l'image soit disponible sur Docker Hub
          MAX_RETRIES=10
          RETRY=0
          while [ $RETRY -lt $MAX_RETRIES ]; do
            if docker manifest inspect ${IMAGE} &>/dev/null; then
              echo "[OK] Image ${IMAGE} found on Docker Hub"
              break
            else
              RETRY=$((RETRY + 1))
              if [ $RETRY -lt $MAX_RETRIES ]; then
                echo "[WAIT] Image not available yet (attempt $RETRY/$MAX_RETRIES), waiting 10s..."
                sleep 10
              else
                echo "[ERROR] Image ${IMAGE} not found after $MAX_RETRIES attempts"
                exit 1
              fi
            fi
          done

      - name: Deploy to Kubernetes
        run: |
          VERSION="${{ needs.versioning.outputs.version }}"
          # Retirer le 'v' au début si présent
          VERSION_NO_V="${VERSION#v}"
          IMAGE="${{ env.IMAGE_NAME }}:${VERSION_NO_V}"
          K3S_IP="${{ steps.k3s-ip.outputs.K3S_IP }}"

          # Remplacer le placeholder PUBLIC_IP par l'IP publique réelle
          echo "[INFO] Configuring PUBLIC_IP in deployment: ${K3S_IP}"
          sed -i "s/PUBLIC_IP_PLACEHOLDER/${K3S_IP}/g" k8s/deployment.yaml

          # Remplacer le placeholder VERSION par la version Git réelle
          echo "[INFO] Configuring APP_VERSION in deployment: ${VERSION}"
          sed -i "s/VERSION_PLACEHOLDER/${VERSION}/g" k8s/deployment.yaml

          # Créer le namespace si nécessaire
          kubectl create namespace production --dry-run=client -o yaml | kubectl apply -f -

          # Créer le secret DATABASE_URL depuis l'output Terraform
          echo "[INFO] Creating database-url secret..."
          cd terraform
          AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          terraform init -backend-config="bucket=auth-service-tfstate-prod-${AWS_ACCOUNT_ID}" \
            -backend-config="key=terraform.tfstate" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -reconfigure -input=false -no-color > /dev/null 2>&1 || true
          DB_HOST=$(terraform output -raw rds_endpoint 2>/dev/null || echo "")
          DB_USER=$(terraform output -raw rds_username 2>/dev/null || echo "")
          DB_PASS=$(terraform output -raw rds_password 2>/dev/null || echo "")
          DB_NAME=$(terraform output -raw rds_database_name 2>/dev/null || echo "authdb")
          cd ..
          if [ -n "${DB_HOST}" ] && [ -n "${DB_USER}" ] && [ -n "${DB_PASS}" ]; then
            DATABASE_URL="postgres://${DB_USER}:${DB_PASS}@${DB_HOST}/${DB_NAME}?sslmode=require"
            kubectl create secret generic database-url \
              --from-literal=url="${DATABASE_URL}" \
              --namespace=production \
              --dry-run=client -o yaml | kubectl apply -f -
            echo "[OK] Secret database-url créé/mis à jour"
          else
            echo "[WARNING] Outputs Terraform manquants, secret non mis à jour"
          fi

          # Appliquer tous les manifests Kubernetes avec server-side apply pour éviter les conflits
          echo "[INFO] Applying Kubernetes manifests..."
          kubectl apply -f k8s/ --server-side=true --force-conflicts -n production

          # Mettre à jour l'image du deployment avec la nouvelle version
          echo "[INFO] Updating image to ${IMAGE}..."
          kubectl set image deployment/auth-service \
            auth-service=${IMAGE} \
            -n production \
            --record=false

          # Attendre le rollout avec un timeout plus long
          echo "[INFO] Waiting for rollout to complete for version ${VERSION_NO_V}..."
          kubectl rollout status deployment/auth-service -n production --timeout=10m

          # Vérifier que les pods sont bien démarrés
          echo "[INFO] Pods status:"
          kubectl get pods -n production -l app=auth-service -o wide

          echo "[OK] Deployment successful!"

      - name: Deployment summary
        run: |
          VERSION="${{ needs.versioning.outputs.version }}"
          VERSION_NO_V="${VERSION#v}"
          K3S_IP="${{ steps.k3s-ip.outputs.K3S_IP }}"

          echo "## Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Build Information" >> $GITHUB_STEP_SUMMARY
          echo "- **Git Version**: ${{ needs.versioning.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Docker Image**: ${{ env.IMAGE_NAME }}:${VERSION_NO_V}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Author**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Access URLs" >> $GITHUB_STEP_SUMMARY
          echo "- **[Scalar API Docs](http://${K3S_IP}:30081/scalar)** - Interactive interface" >> $GITHUB_STEP_SUMMARY
          echo "- **[Version Info](http://${K3S_IP}:30081/version)** - App version" >> $GITHUB_STEP_SUMMARY
          echo "- **[Health Check](http://${K3S_IP}:30081/health)** - API status" >> $GITHUB_STEP_SUMMARY
          echo "- **[Swagger JSON](http://${K3S_IP}:30081/api-docs/swagger.json)** - OpenAPI specification" >> $GITHUB_STEP_SUMMARY
          echo "- **[Register](http://${K3S_IP}:30081/api/auth/register)** - Create account" >> $GITHUB_STEP_SUMMARY
          echo "- **[Login](http://${K3S_IP}:30081/api/auth/login)** - Sign in" >> $GITHUB_STEP_SUMMARY

  # ---------------------------------------------------------
  # Job 7: Terraform Destroy (Manuel uniquement)
  # ---------------------------------------------------------
  terraform-destroy:
    name: Terraform Destroy (AWS)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
    environment:
      name: destruction

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0
          terraform_wrapper: false

      - name: Configure S3 Backend
        working-directory: ./terraform
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          # Récupérer l'ID du compte AWS pour le nom du bucket
          AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET_NAME="auth-service-tfstate-prod-${AWS_ACCOUNT_ID}"

          echo "[INFO] Configuring S3 backend: ${BUCKET_NAME}"

          # Créer le fichier backend
          cat > backend-override.tf <<EOF
          terraform {
            backend "s3" {
              bucket = "${BUCKET_NAME}"
              key    = "terraform.tfstate"
              region = "${AWS_REGION}"
            }
          }
          EOF

          # Initialiser avec le backend S3
          terraform init -reconfigure

      - name: Terraform Destroy
        working-directory: ./terraform
        env:
          TF_VAR_docker_username: ${{ secrets.DOCKER_USERNAME }}
          TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          echo "[WARNING] Destroying all AWS infrastructure!"
          echo "[INFO] Destruction in progress..."
          terraform destroy -auto-approve
          echo "[OK] AWS infrastructure destroyed successfully!"

      - name: Destruction summary
        run: |
          echo "## Infrastructure Destroyed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All AWS resources have been deleted:" >> $GITHUB_STEP_SUMMARY
          echo "- EC2 instances terminated" >> $GITHUB_STEP_SUMMARY
          echo "- Security groups deleted" >> $GITHUB_STEP_SUMMARY
          echo "- SSH keys deleted" >> $GITHUB_STEP_SUMMARY
          echo "- All Terraform resources destroyed" >> $GITHUB_STEP_SUMMARY
